<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35 ST BN Personnel Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

<h2>35 ST BN</h2>

<ul>

<li><i class="fa-solid fa-house"></i> Dashboard</li>

<li><i class="fa-solid fa-users"></i> Personnel</li>

<li><i class="fa-solid fa-building-shield"></i> Section</li>

<li><i class="fa-solid fa-chart-column"></i> Report</li>

<li><i class="fa-solid fa-file-excel"></i> Import Excel</li>

</ul>

</div>

<div class="content">

<h2>Personnel Management System</h2>

<div class="cards">

<div class="card green">

<h3>Total Personnel</h3>

<h1 id="total">0</h1>

</div>

<div class="card blue">

<h3>Collected</h3>

<h1 id="collected">0</h1>

</div>

<div class="card red">

<h3>Remaining</h3>

<h1 id="remaining">0</h1>

</div>

<div class="card yellow">

<h3>Sections</h3>

<h1>6</h1>

</div>

</div>
<div class="row mt-4">

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>HQ BN</h5>
<h3 id="hqCount">0</h3>
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>59 COY</h5>
<h3 id="c59Count">0</h3>
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>60 COY</h5>
<h3 id="c60Count">0</h3>
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>61 COY</h5>
<h3 id="c61Count">0</h3>
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>MTPL</h5>
<h3 id="mtplCount">0</h3>
</div>
</div>

<div class="col-md-4 mb-3">
<div class="card p-3">
<h5>EME</h5>
<h3 id="emeCount">0</h3>
</div>
</div>

</div>

<input type="file" id="excelFile">
<input type="text" id="search">

<table>

<thead>

<tr>

<th>ID</th>

<th>Rank</th>

<th>Name</th>

<th>Trade</th>

<th>Coy</th>

<th>District</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="script.js"></script>

</body>
</html>
