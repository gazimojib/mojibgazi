<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35 ST BN Personnel Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<style>

body{
    background:#edf2f7;
    font-family:Arial,Helvetica,sans-serif;
}

.navbar{
    background:#1b4332;
}

.logo{
    color:#fff;
    font-weight:bold;
    font-size:22px;
}

.card{
    border:none;
    border-radius:18px;
    box-shadow:0 10px 20px rgba(0,0,0,.12);
}

.stat{
    font-size:35px;
    font-weight:bold;
}

.search-box{
    height:55px;
    border-radius:50px;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:40px;
    padding:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<span class="logo">

<i class="fa-solid fa-shield-halved"></i>

35 ST BN PMS

</span>

</div>

</nav>

<div class="container mt-4">

<h3>Personnel Dashboard</h3>

<div class="row g-4 mt-1">

<div class="col-md-3">

<div class="card p-3">

Total Personnel

<div class="stat text-success">

385

</div>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

Collected

<div class="stat text-primary">

277

</div>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

Remaining

<div class="stat text-danger">

108

</div>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

Sections

<div class="stat text-warning">

6

</div>

</div>

</div>

</div>

<input type="text" id="search" class="form-control search-box" placeholder="Search by ID, Name, Rank">
<div class="mt-3">
    <input type="file" id="excelFile" class="form-control" accept=".xlsx,.xls">
</div>

<table class="table table-bordered table-hover bg-white mt-4">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Rank</th>
<th>Name</th>
<th>Trade</th>
<th>Section</th>
<th>Status</th>

</tr>

</thead>

<tbody>

<tr>

<td>1812151</td>

<td>SGT</td>

<td>MD SAFIKUL ISLAM</td>

<td>CLK</td>

<td>59 COY</td>

<td><span class="badge bg-success">Collected</span></td>

</tr>

</tbody>

</table>

</div>

<div class="footer">

© 2026 | 35 ST BN Personnel Management System

</div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="script.js"></script>
